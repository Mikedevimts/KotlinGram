name: Build KotlinGram

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "arm64 (почти все телефоны), armv7, x64, x86 или afat"
        default: "arm64"
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "build-tools;30.0.3" \
            "ndk;21.4.7075529" \
            "cmake;3.10.2.4988404"
          for v in 33.0.0 33.0.1; do
            if [ -d "$ANDROID_HOME/build-tools/$v" ]; then
              cp "$ANDROID_HOME/build-tools/30.0.3/dx" "$ANDROID_HOME/build-tools/$v/dx" || true
              cp "$ANDROID_HOME/build-tools/30.0.3/lib/dx.jar" "$ANDROID_HOME/build-tools/$v/lib/dx.jar" || true
            fi
          done

      - name: Check keys
        run: |
          test -s API_KEYS || { echo "::error::API_KEYS not found in repo root"; exit 1; }
          test -s TMessagesProj/config/kotlingram.jks || { echo "::error::kotlingram.jks not found in TMessagesProj/config"; exit 1; }
          grep -q '^APP_ID=[0-9]' API_KEYS || { echo "::error::APP_ID in API_KEYS is empty or invalid"; exit 1; }
          if grep -q 'ВСТАВЬ' API_KEYS; then echo "::error::API_KEYS still has placeholders"; exit 1; fi

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          FLAVOR="${{ github.event.inputs.flavor }}"
          FLAVOR="${FLAVOR:-arm64}"
          TASK="assemble$(echo "${FLAVOR:0:1}" | tr a-z A-Z)${FLAVOR:1}Release"
          echo "Running $TASK"
          ./gradlew "$TASK" --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Dorg.gradle.workers.max=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KotlinGram-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            TMessagesProj/build/reports/**
            TMessagesProj/.cxx/**/*.log
          if-no-files-found: ignore
